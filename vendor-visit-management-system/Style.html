<style>

body{

font-family:Arial;
background:#f5f5f5;

}

.container{

width:700px;
margin:30px auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 25px rgba(0,0,0,.15);

}

input,textarea{

width:100%;
padding:10px;
margin-top:5px;
margin-bottom:15px;

}

button{
background:#1565C0;
color:white;
padding:12px 25px;
border:none;
border-radius:8px;
font-size:16px;
cursor:pointer;
transition:.3s;
margin:5px;

}

button:hover{

background:#0D47A1;
transform:scale(1.03);

}

.fileRow{

    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#ffffff;
    border:1px solid #d9d9d9;
    border-radius:10px;
    padding:10px 15px;
    margin-top:10px;
    transition:.25s;
}

.fileRow:hover{

    box-shadow:0 3px 10px rgba(0,0,0,.08);

}

.fileInfo{
    display:flex;
    align-items:center;
    flex:1;
    overflow:hidden;
}

.fileIcon{
    color:#1565C0;
    font-size:20px;
    margin-right:12px;
}

.fileName{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    font-size:15px;
}

.removeBtn{
    width:36px;
    height:36px;
    border:none;
    border-radius:50%;
    background:#FDECEC;
    color:#D32F2F;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.25s;
     flex-shrink:0;
}

.removeBtn:hover{
    background:#D32F2F;
    color:white;
    transform:scale(1.1);
}

#submitBtn{

    width:100%;
    margin-top:20px;
    font-size:18px;
    font-weight:bold;

}

#submitBtn:disabled{

    background:#9e9e9e;
    cursor:not-allowed;
    transform:none;

}

#statusMessage{

    margin-top:15px;
    text-align:center;
    font-weight:bold;
    color:#1565C0;

}

</style>
