<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:#edf2f7;
    color:#263238;
    padding-bottom:55px;
}

.page{
    width:95%;
    max-width:1400px;
    margin:25px auto;
}

.topbar{

    background:#0F4C81;
    color:white;

    border-radius:10px;

    padding:18px 25px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 3px 10px rgba(0,0,0,.15);

    margin-bottom:25px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:18px;
}

.logo-box{

    width:60px;
    height:60px;

    background:white;
    color:#0F4C81;

    font-size:28px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:8px;
}

.title{

    font-size:24px;
    font-weight:700;
    letter-spacing:.5px;

}

.subtitle{

    font-size:14px;
    opacity:.9;
    margin-top:4px;

}

.version{

    font-size:15px;
    font-weight:600;

}

.content-card{

    background:white;

    border-radius:10px;

    padding:25px;

    margin-bottom:22px;

    box-shadow:0 1px 4px rgba(0,0,0,.08);

}

.section-title{

    font-size:18px;

    color:#0F4C81;

    font-weight:700;

    margin-bottom:22px;

    border-left:5px solid #0F4C81;

    padding-left:12px;

}

.form-grid{

    display:grid;

    grid-template-columns:180px 350px;

    row-gap:18px;

    column-gap:20px;

    align-items:center;

}

label{

    font-weight:600;

    font-size:15px;

}

input,
select{

    width:100%;

    padding:11px 14px;

    border:1px solid #cfd8dc;

    border-radius:6px;

    font-size:15px;

    transition:.2s;

    background:white;

}

input:focus,
select:focus{

    outline:none;

    border-color:#1565C0;

    box-shadow:0 0 5px rgba(21,101,192,.35);

}

.parameter-grid{

    display:grid;

    grid-template-columns:220px 250px 70px;

    row-gap:16px;

    column-gap:15px;

    align-items:center;

}

.parameter-grid span{

    font-size:14px;

    color:#546e7a;

}

.button-panel{

    display:flex;

    justify-content:center;

    gap:15px;

    margin-top:25px;

}

button{

    min-width:180px;

    padding:13px;

    font-size:15px;

    border:none;

    border-radius:6px;

    cursor:pointer;

    transition:.2s;

    font-weight:600;

}

.btn-primary{

    background:#1565C0;

    color:white;

}

.btn-primary:hover{

    background:#0d47a1;

}

.btn-secondary{

    background:#eceff1;

    color:#37474f;

}

.btn-secondary:hover{

    background:#d5dde2;

}

.placeholder{

    color:#90a4ae;

    text-align:center;

    padding:45px;

    border:2px dashed #cfd8dc;

    border-radius:8px;

}

.result-grid{

    display:grid;

    grid-template-columns:250px 250px;

    row-gap:15px;

    column-gap:25px;

}

.result-name{

    font-weight:600;

}

.result-value{

    color:#2E7D32;

    font-weight:bold;

    font-size:18px;

}

#loadingOverlay{

    position:fixed;

    left:0;
    top:0;

    width:100%;
    height:100%;

    background:rgba(255,255,255,.75);

    display:none;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    backdrop-filter:blur(3px);

    z-index:99999;

}

.loader{

    width:70px;
    height:70px;

    border:7px solid #dbe8f5;

    border-top:7px solid #1565C0;

    border-radius:50%;

    animation:spin .8s linear infinite;

}

.loadingText{

    margin-top:18px;

    font-size:18px;

    font-weight:600;

    color:#0F4C81;

}

@keyframes spin{

    from{

        transform:rotate(0deg);

    }

    to{

        transform:rotate(360deg);

    }

}

@media(max-width:768px){

.form-grid{

grid-template-columns:1fr;

}

.parameter-grid{

grid-template-columns:1fr;

}
.parameter-unit{

    margin-top:-8px;

    margin-bottom:12px;

}


.result-grid{

grid-template-columns:1fr;

}

.topbar{

flex-direction:column;
gap:15px;
justify-content:center;

}

.logo-area{

flex-direction:column;

}

button{

width:100%;

}

.button-panel{

flex-direction:column;

}

}

.toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
}

.toolbar-btn{

    background:#ffffff;

    border:1px solid #cfd8dc;

    border-radius:6px;

    padding:10px 16px;

    cursor:pointer;

    font-size:14px;

    transition:.2s;

}

.toolbar-btn:hover{

    background:#0F4C81;

    color:white;

}

.toolbar-btn:disabled{

    opacity:.5;

    cursor:not-allowed;

}

.parameter-row{

    display:grid;

    grid-template-columns:220px 1fr 80px;

    gap:15px;

    align-items:center;

    margin-bottom:12px;

}

.parameter-label{

    font-weight:600;

}

.parameter-unit{

    color:#666;

}

.parameter-input{

    width:100%;

    padding:8px 10px;

    border:1px solid #cfd8dc;

    border-radius:5px;

    font-size:14px;

}

.parameter-input:focus{

    outline:none;

    border-color:#0F4C81;

}

.parameter-value{

    padding:8px 10px;

    border-bottom:2px solid #d6d6d6;

    min-height:22px;

}
.result-value{

    font-size:20px;

    font-weight:bold;

    color:#0b7a32;

}
.status-bar{

    position:fixed;

    bottom:0;

    left:0;

    right:0;

    background:#0F4C81;

    color:white;

    padding:10px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:13px;

    z-index:999;

}
</style>
